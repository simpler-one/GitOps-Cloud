# state management, deletion pipeline, what to push in the terraform folder?
name: setting up k8s cluster

on:
  workflow_dispatch:

  # push:
  #   branches:
  #     master

jobs:
  cd_infra:
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read
    steps: 
      - name: Getting Artifacts
        uses: actions/checkout@v4

      - name: Configrue AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::158694915030:role/GHAAccessToTerraformEKS
          aws-region: ap-south-1
          role-session-name: GitHubActionsTerraform   

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2" 
    
      - name: Terraform Actions 
        working-directory: ./terraform
        env:
          TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          TF_VAR_github_runner_token: ${{ secrets.ARC_TOKEN }} 
        run: |
          terraform init
          terraform apply -auto-approve



