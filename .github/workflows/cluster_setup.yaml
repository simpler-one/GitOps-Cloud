# state management, deletion pipeline, what to push in the terraform folder?
name: setting up k8s cluster

on:
  workflow_dispatch:
    inputs:
      secret_passphrase:
        description: secret word to create cluster
        type: string
        required: true

  # push:
  #   branches:
  #     master

jobs:
  cluster-setup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read
    steps: 
      - name: validating the secret word
        env:
          INPUT_SECRET: ${{github.event.inputs.secret_passphrase}}
          EXPECTED_SECRET: ${{secrets.DEPLOY_PASSPHRASE}}
        run: |
          echo "::add-mask::$INPUT_SECRET"

          if [ -z "$EXPECTED_SECRET" ]; then
            echo "Error: Expected secret is not configured."
            exit 1
          fi

          if [ "$INPUT_SECRET" != "$EXPECTED_SECRET" ]; then
            echo "Validation failed: Invalid passphrase."
            exit 1
          fi

          echo "Validation succeeded!"

      - name: Getting Artifacts
        uses: actions/checkout@v4

      # - name: Debug OIDC token claims
      #   run: |
      #     TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
      #     echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref}'

      - name: Configrue AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1  

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2" 
    
      - name: Terraform Actions 
        working-directory: ./terraform
        env:
          TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          TF_VAR_github_runner_token: ${{ secrets.ARC_TOKEN }} 
        run: |
          terraform init
          terraform apply -auto-approve



