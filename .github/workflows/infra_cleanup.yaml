name: Dissemble Infrastructre

on: 
  workflow_dispatch:


jobs:
  removing_components:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps: 

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configrue AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} 
          aws-region: ap-south-1
          role-session-name: GitHubActionsTerraform

      - name: Install AWS CLI v2
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
            rm -rf aws awscliv2.zip
          fi
          aws --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2" # Match the version your state/config uses

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl and Delete ArgoCD Applications
        continue-on-error: true
        run: |
          CLUSTER_NAME=$(aws eks list-clusters --region ap-south-1 --query 'clusters[0]' --output text)
          if [ -n "$CLUSTER_NAME" ] && [ "$CLUSTER_NAME" != "None" ]; then
            aws eks update-kubeconfig --region ap-south-1 --name "$CLUSTER_NAME"
            kubectl delete applications.argoproj.io --all -n argocd --wait=true --timeout=120s || true
          else
            echo "No EKS cluster found in ap-south-1; skipping kubectl cleanup."
          fi

      - name: Terraform Destroy
        env:
          TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          TF_VAR_github_runner_token: ${{ secrets.ARC_TOKEN }}
        working-directory: ./terraform
        run: |
          terraform init 
          terraform destroy -auto-approve

